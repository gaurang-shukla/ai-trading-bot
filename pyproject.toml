[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "three-layer-ai-trading-bot"
version = "0.4.0"
description = "Paper-first trading pipeline integrating OpenBB, TradingAgents, and Paperclip"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
upstreams = ["openbb==4.7.3", "tradingagents==0.4.0", "openai>=1.76,<2", "yfinance>=0.2.54,<0.3"]
dev = ["pytest>=8,<9"]

[project.scripts]
tradebot = "tradebot.cli:main"
signal-app = "tradebot.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradebot"]

[tool.hatch.build.targets.wheel.force-include]
"src/tradebot/web" = "tradebot/web"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
